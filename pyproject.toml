[project]
name = "patch2meta"
version = "0.1.0"
description = "Forecast pro draft priority in League of Legends from patch-note text"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.27",
    "lxml>=6.1.3",
    "pandas>=2.2",
    "pyarrow>=17",
    "pydantic>=2.8",
]

[dependency-groups]
dev = ["ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 110
